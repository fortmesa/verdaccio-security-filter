# Verdaccio's plugin loader resolves plugins via plain Node require() against
# a conventional node_modules layout (verified against the installed
# @verdaccio/loaders source) -- it has no knowledge of Yarn's Plug'n'Play
# resolution hooks. This must stay node-modules, not the Yarn 4 default (pnp),
# or Verdaccio won't be able to load this plugin's own dependencies at runtime.
nodeLinker: node-modules
