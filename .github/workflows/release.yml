name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Jobs without their own permissions: block get only this.
permissions:
  contents: read

jobs:
  # S3-read only -- the ONLY job in this workflow that installs
  # dependencies; test/release/publish-npm/publish-npmjs below restore its
  # node_modules from cache. It installs with --mode=skip-build, so no
  # dependency's install-time script (the "Shai-Hulud" class of
  # supply-chain attack) runs here either. That matters because this job
  # holds id-token: write for the gha-install role, and with it a script
  # could mint a GitHub OIDC token for the npmjs.dev.fort.blue audience,
  # which that registry accepts as a publish credential for this repo.
  install:
    name: Install
    runs-on: ubuntu-slim
    # gha-install is shared across every fortmesa repo -- its trust policy
    # wildcards the repo segment and pins the environment segment to exactly
    # "install", so every onboarding repo just needs a GitHub Environment of
    # this same name (Settings -> Environments, no protection rules needed --
    # it's used purely for OIDC claim-scoping here). This role can only read
    # already-public package bytes back out of the registry's own S3
    # storage -- nothing sensitive to leak, which is why it's safe to share
    # instead of minting a per-repo copy of an identical policy.
    environment: install
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false # don't leave a git credential for a malicious postinstall to scrape

      # A tag that doesn't match package.json would publish the wrong
      # version (or 409 on one already published) while still creating a
      # GitHub release under the tag.
      - name: Check the tag matches the package version
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::869756787046:role/gha-install
          aws-region: us-east-1

      # yarn-plugin-yarnstatic-s3 talks to S3 directly, in-process, via
      # Yarn's own wrapNetworkRequest hook and the AWS SDK -- no Go binary,
      # no daemon, no Unix socket (unlike the sibling yarn-plugin-yarnstatic,
      # which spawns `yarnstatic serve` and talks to it that way). Sourced
      # from this org's own S3 storage via the role assumed above, not
      # GitHub releases -- gha-install needs s3:GetObject on
      # fmdev-npmjs-storage/fortmesa/yarnstatic/* for this step (separate
      # from, and in addition to, its existing grant on verdaccio/* below).
      # `yarn plugin import` on a local path copies the file into
      # .yarn/plugins/ and registers it in .yarnrc.yml itself, so the
      # downloaded copy can be deleted right after.
      - name: Install yarn-plugin-yarnstatic-s3 (pinned + checksum-verified)
        env:
          YARNSTATIC_VERSION: v1.1.2
        run: |
          set -eu
          PREFIX="s3://fmdev-npmjs-storage/fortmesa/yarnstatic/${YARNSTATIC_VERSION}"
          aws s3 cp "${PREFIX}/plugin-yarnstatic-s3.cjs" plugin-yarnstatic-s3.cjs
          aws s3 cp "${PREFIX}/checksums.txt" checksums.txt
          grep " plugin-yarnstatic-s3.cjs\$" checksums.txt | sha256sum -c -
          yarn plugin import ./plugin-yarnstatic-s3.cjs
          rm plugin-yarnstatic-s3.cjs checksums.txt

      # Zero live-registry network access -- tarballs come from the
      # registry's own S3 storage via yarn-plugin-yarnstatic-s3 (in-process
      # AWS SDK calls, using the role assumed above), not npmjs.dev.fort.blue
      # itself. No "yarnstatic check" pre-flight step here -- that's the Go
      # binary's separate offline lockfile-vs-S3 drift-detection subcommand,
      # unrelated to the install-time fetch path this plugin replaces.
      - name: Install dependencies
        env:
          YARNSTATIC_BUCKET: fmdev-npmjs-storage
          YARNSTATIC_KEY_PREFIX: verdaccio
        run: yarn install --immutable --mode=skip-build

      # .yarn/install-state.gz travels with node_modules so Yarn recognizes
      # the tree as already-installed downstream and never tries an implicit
      # revalidation-triggered network fetch of its own.
      - name: Cache node_modules for this run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ github.sha }}

  test:
    name: Test (Node ${{ matrix.node }})
    needs: install
    runs-on: ubuntu-slim
    strategy:
      matrix:
        # 22.12.0 is package.json's engines floor; 24 is what fm-npmjs runs.
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Test
        run: yarn test

  publish-npm:
    name: Publish npm package
    needs: test
    runs-on: ubuntu-slim
    # In the npmjs environment, this job's OIDC token carries
    # sub: repo:fortmesa/verdaccio-security-filter:environment:npmjs. The
    # registry's allow entry for this repo pins that sub, so a token minted
    # by any other job in this repo (the install job's sub ends in
    # :environment:install) is refused. The environment's v*.*.* tag rule
    # applies here as it does to publish-npmjs.
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ github.sha }}
          fail-on-cache-miss: true

      # npmjs.dev.fort.blue runs verdaccio-oidc-auth and verifies a GitHub
      # Actions OIDC token directly as a bearer credential -- no OAuth
      # exchange, no browser. Its `github-actions` trusted-issuer config
      # (fm-npmjs's k8s/02-configmap.yaml) must have this repo in its `allow`
      # list, and the audience below must match its configured `audience`
      # exactly, or this 401s.
      - name: Get OIDC token for npmjs.dev.fort.blue
        id: oidc
        run: |
          set -eu
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://npmjs.dev.fort.blue" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).value))')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Scoped to this job's ephemeral checkout only -- never written to the
      # repo's own committed .yarnrc.yml/package.json.
      - name: Configure npm registry for @fortmesa scope
        env:
          NPM_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -eu
          yarn config set 'npmScopes.fortmesa.npmRegistryServer' 'https://npmjs.dev.fort.blue'
          yarn config set 'npmScopes.fortmesa.npmPublishRegistry' 'https://npmjs.dev.fort.blue'
          yarn config set 'npmScopes.fortmesa.npmAlwaysAuth' true
          yarn config set 'npmScopes.fortmesa.npmAuthToken' "$NPM_TOKEN"

      - name: Publish to npmjs.dev.fort.blue
        run: yarn npm publish --access public --provenance

  publish-npmjs:
    name: Stage on npmjs.org
    needs: test
    runs-on: ubuntu-slim
    # The package's trusted publisher entry on npmjs.com names this
    # environment, so npm only honors an OIDC token from a job running in
    # it; the environment's v*.*.* tag rule limits which runs get one. npm
    # trusted publishers can only stage, so a maintainer approves each
    # version on npmjs.com with 2FA before it goes live.
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    env:
      # No token is configured for registry.npmjs.org, so `yarn npm publish`
      # trades this job's OIDC token for a short-lived stage token.
      YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
      YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Stage on npmjs.org for approval
        run: yarn npm publish --access public --provenance --staged

  release:
    name: Create release
    needs: test
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules from install job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: node-modules-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Assemble release assets
        run: |
          set -eu
          mkdir -p dist
          # Same tarball publish-npm uploads to npmjs.dev.fort.blue, attached
          # here too so it can be inspected/downloaded without registry
          # access, and outlives that registry's own retention policy.
          # The tag comes from GITHUB_REF_NAME, never substituted into the
          # script, so a tag name can't inject shell.
          yarn pack -o "dist/verdaccio-security-filter-$GITHUB_REF_NAME.tgz"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Replaces the action's fail_on_unmatched_files. With no match, bash
          # passes the literal string dist/* to gh and the upload fails late.
          ls dist/* >/dev/null
          # A re-run finds the release its first attempt made and replaces
          # the assets on it, rather than failing on create. --verify-tag
          # fails if the tag is gone, where gh would otherwise create it at
          # the default branch, a different commit from the one built.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
